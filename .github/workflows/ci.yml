name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .
          playwright install --with-deps chromium
      - name: Fixture before (expect fail)
        run: |
          set +e
          python -m page_ready.score fixtures/01-before-aeo.html
          test $? -eq 1
      - name: Fixture after AEO (expect pass)
        run: python -m page_ready.score fixtures/02-after-aeo-only.html
      - name: Fixture agent-broken (expect fail)
        run: |
          set +e
          python -m page_ready.score fixtures/03-after-aeo-still-agent-broken.html
          test $? -eq 1
