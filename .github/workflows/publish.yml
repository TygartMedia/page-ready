# PyPI Trusted Publisher release
# PyPI side: add publisher → GitHub
#   Owner: TygartMedia
#   Repository: page-ready
#   Workflow: publish.yml
#   Environment: release
#
# Manual only — type "publish" to run.

name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish to release to PyPI'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
