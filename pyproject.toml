[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "page-ready"
version = "0.1.0a0"
description = "Cite-ready (AEO) + click-ready (DOM) binary page scoring for humans and agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tygart Media" }]
dependencies = [
  "playwright>=1.40",
]
keywords = ["aeo", "geo", "accessibility", "agent", "mcp", "playwright"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
page-ready = "page_ready.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
